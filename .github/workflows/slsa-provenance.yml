name: Build Provenance & Code Signing (SLSA)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build:
    name: Build, Sign & Provenance (SLSA L3)
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Package build artifact
        run: |
          tar -czf nunnn-stock-analyzer-${{ github.sha }}.tar.gz \
            .next package.json package-lock.json next.config.ts
          sha256sum nunnn-stock-analyzer-${{ github.sha }}.tar.gz > checksums.txt

      - name: Install cosign (Sigstore)
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign artifact (keyless OIDC)
        run: |
          cosign sign-blob --yes \
            --output-signature nunnn-stock-analyzer-${{ github.sha }}.sig \
            --output-certificate nunnn-stock-analyzer-${{ github.sha }}.pem \
            nunnn-stock-analyzer-${{ github.sha }}.tar.gz

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@5a775b367a56d5bd118a224a811bba288150a563 # v2.0.0
        with:
          image: nunnn-stock-analyzer:${{ github.sha }}
          digest: ${{ steps.build.outputs.digest }}
        continue-on-error: true

      - name: Verify signature
        run: |
          cosign verify-blob \
            --certificate nunnn-stock-analyzer-${{ github.sha }}.pem \
            --signature nunnn-stock-analyzer-${{ github.sha }}.sig \
            --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            nunnn-stock-analyzer-${{ github.sha }}.tar.gz

      - name: Upload signed artifact + provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-build
          path: |
            nunnn-stock-analyzer-*.tar.gz
            nunnn-stock-analyzer-*.sig
            nunnn-stock-analyzer-*.pem
            checksums.txt
