repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml']

  - repo: https://github.com/semgrep/semgrep
    rev: v1.102.0
    hooks:
      - id: semgrep
        args:
          - '--config'
          - p/owasp-top-ten
          - '--config'
          - p/nextjs
          - '--config'
          - p/typescript
          - '--config'
          - .semgrep/custom-rules.yml
          - '--error'
